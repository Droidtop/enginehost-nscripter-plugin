name: Build Enginehost NScripter bundle

on:
  push:
    branches: ["plugin/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Promote this build to a GitHub Release on the chosen channel. Stable is
          for a bundle that has been used with real games on hardware; testing
          for one that runs games but has not been lived with. Every push
          already publishes to the unstable channel by itself.
        type: boolean
        default: false
      channel:
        description: "Release channel for a promoted build"
        type: choice
        options: [stable, testing]
        default: stable
      tag:
        description: "Release tag (default: derived from the bundle id; testing adds -testing)"
        type: string
        default: ""

permissions:
  contents: read

# One agent push supersedes the previous one instead of racing it. A promotion
# gets a group of its own, keyed on its run id, so it is never cancelled by the
# next commit landing on the branch it was dispatched from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

env:
  # The NDK the sandboxed plugin library is built with.
  NDK_VERSION: "26.3.11579264"

jobs:
  # The engine itself, proven to start and draw before anything is packaged.
  # It builds the Linux target of the same CMake project the Android library
  # comes from, so a break in the engine's own code shows up here in two
  # minutes instead of on a device after a twenty-minute Android build.
  headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install what the Linux target links
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             cmake g++ pkg-config xvfb fonts-dejavu-core             libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev             liblua5.4-dev libbz2-dev libjpeg-dev
      - run: tests/run_headless_game.sh

  bundle:
    # Builds and packs the payload. No signing key and no write token here:
    # the engine's third-party sources, the NDK and the actions below run in
    # this job.
    needs: headless
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""
      - name: Install the pinned NDK
        run: |
          set -eux
          yes | sdkmanager --install "ndk;$NDK_VERSION" > /dev/null
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"
      - name: Fetch the libretro core's third-party sources
        # The commits upstream OnscripterYuri v0.7.7beta pins for
        # src/onsyuri_libretro/deps (its submodules; this fork carries the
        # core's own config files for them but not the gitlinks).
        working-directory: src/onsyuri_libretro/deps
        run: |
          set -eux
          fetch() {
            git init -q "$1"
            git -C "$1" remote add origin "$2"
            git -C "$1" fetch -q --depth 1 origin "$3"
            git -C "$1" checkout -q FETCH_HEAD
          }
          fetch SDL https://github.com/libsdl-org/SDL.git da19244f7f529c9a4bfe3f1d62d2c002afd91f1e
          fetch SDL_image https://github.com/libsdl-org/SDL_image.git 0583551f2f504bd446d07089423020cd358e4037
          fetch SDL_mixer https://github.com/libsdl-org/SDL_mixer.git a294d5827dd0bf13e6f972d6441c96f1b752cc6d
          fetch SDL_ttf https://github.com/libsdl-org/SDL_ttf.git 6c5ae379ed593ca8cb65bfabb8bc816c03e9579d
          git -C SDL_ttf submodule update --init --depth 1 external/freetype
          fetch bzip2 https://github.com/libarchive/bzip2.git 1ea1ac188ad4b9cb662e3f8314673c63df95a589
          fetch lua https://github.com/lua/lua.git 75ea9ccbea7c4886f30da147fb67b693b2624c26
      - name: Build the libretro core into the sandboxed plugin library
        # The core as static archives (its CMake only works top-level), then
        # enginehost/android/CMakeLists.txt links them with Enginehost's
        # libretro frontend and file layer: one library per ABI, C++ runtime
        # inside. Runs in Enginehost's isolated process (OnsyuriPlugin).
        run: |
          set -eux
          toolchain="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake"
          for ABI in arm64-v8a x86_64; do
            common=(-G Ninja -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DANDROID_ABI="$ABI"
                    -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release)
            cmake -S src/onsyuri_libretro -B "build/onsyuri-$ABI" "${common[@]}" -DLIBRETRO_STATIC=ON
            cmake --build "build/onsyuri-$ABI" --target onsyuri_libretro --parallel 4
            cmake -S enginehost/android -B "build/enginehost-$ABI" "${common[@]}" \
              -DONSYURI_BUILD_DIR="$PWD/build/onsyuri-$ABI"
            cmake --build "build/enginehost-$ABI" --target nscripter_enginehost --parallel 4
          done
      - name: Compile the plugin class
        # The API classes are Enginehost's at run time: compiled against,
        # never packed.
        run: |
          set -eux
          jar="$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar"
          d8="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/d8"
          mkdir -p build/api-classes build/plugin-classes build/dex
          javac -nowarn -source 17 -target 17 -cp "$jar" -d build/api-classes $(find enginehost/android/api -name '*.java')
          javac -nowarn -source 17 -target 17 -cp "$jar:build/api-classes" -d build/plugin-classes \
            plugin-native/libretro/LibretroPlugin.java $(find enginehost/android/java -name '*.java')
          "$d8" --release --min-api 26 --lib "$jar" --classpath build/api-classes --output build/dex \
            $(find build/plugin-classes -name '*.class')
      - name: Check the wrapper against the engine it wraps
        run: python3 tests/check_engine_contract.py
      - name: Pack the unsigned bundle inputs
        run: |
          set -euo pipefail
          mkdir -p build/unsigned/payload
          cp build/dex/classes.dex build/unsigned/payload/classes.dex
          nm="$(find "$ANDROID_HOME/ndk/$NDK_VERSION" -name llvm-nm -path '*linux-x86_64*' | head -1)"
          for ABI in arm64-v8a x86_64; do
            mkdir -p "build/unsigned/payload/lib/$ABI"
            cp "build/enginehost-$ABI/libnscripter_enginehost.so" "build/unsigned/payload/lib/$ABI/"
            # The isolated runtime binds the plugin's natives and the file
            # layer through these two entry points.
            symbols="$("$nm" -D --defined-only "build/unsigned/payload/lib/$ABI/libnscripter_enginehost.so")"
            grep -q ' enginehost_register_natives$' <<<"$symbols"
            grep -q ' enginehost_vfs_bind$' <<<"$symbols"
          done
          cp enginehost/LICENSES.md build/unsigned/payload/LICENSES.md
          cp THIRD_PARTY.md build/unsigned/payload/THIRD_PARTY.md
          cp LICENSE build/unsigned/payload/COPYING.onscripter
          cp enginehost/bundle-metadata.json build/unsigned/bundle-metadata.json
          # A tar keeps the file modes the manifest signs; an artifact would not.
          tar -cf build/unsigned.tar -C build/unsigned payload bundle-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enginehost-nscripter-onsyuri-v1-unsigned
          path: build/unsigned.tar
          if-no-files-found: error

  sign:
    # Enginehost's one signing mechanism, pinned by commit: the key never
    # shares a runner with the build (Enginehost
    # docs/security/2026-09-24-ci-supply-chain.md).
    needs: bundle
    permissions:
      contents: read
    uses: Droidtop/enginehost/.github/workflows/sign-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      unsigned-artifact: enginehost-nscripter-onsyuri-v1-unsigned
      bundle: dev.enginehost.nscripter.onsyuri.v1.enginehost.tar.xz
      artifact-name: enginehost-nscripter-onsyuri-v1
    secrets:
      ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}

  publish:
    # Promotion is deliberate: a manual dispatch names the channel. Stable
    # means used with real games on hardware; testing means it runs games
    # but has not been lived with. Enginehost offers each person the channel
    # they chose in Settings and every steadier one. The release logic lives
    # once, in Droidtop/enginehost (Droidtop/tracker#196).
    needs: sign
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      artifact-name: enginehost-nscripter-onsyuri-v1
      channel: ${{ inputs.channel }}
      tag: ${{ inputs.tag }}
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}

  unstable:
    # Every green push that produced a signed bundle is published as-is on
    # the unstable channel, replacing the previous one, so a person who opted
    # into unstable in Enginehost sees each build the moment CI is done with
    # it, and the build also gets its permanent history release. Branches
    # whose build makes no bundle publish nothing.
    needs: sign
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      artifact-name: enginehost-nscripter-onsyuri-v1
      channel: unstable
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}
