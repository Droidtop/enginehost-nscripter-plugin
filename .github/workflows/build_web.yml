name: build web
on:
  push: {tags:  ['v*']} #  Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request: 

# Read-only by default; only the jobs that create releases may write
# (Enginehost docs/security/2026-09-24-ci-supply-chain.md).
permissions:
  contents: read
  
env:
  EMSDK_HOME: /opt/emsdk
  BUILD_NAME: onsyuri_web

jobs:
  install_emsdk:
    runs-on: ubuntu-24.04 # default batch, powershell
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    
    - name: check or make emsdk cache
      id: check_emsdk
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
      with: 
        path: ${{ env.EMSDK_HOME }}
        key: emsdk
    
    - name: install emsdk
      if: steps.check_emsdk.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/emscripten-core/emsdk.git ${{ env.EMSDK_HOME }}
        cd ${{ env.EMSDK_HOME }} 
        ./emsdk install latest && ./emsdk activate latest
        source ./emsdk_env.sh
        embuilder build sdl2 sdl2_ttf sdl2_image sdl2_mixer bzip2 ogg vorbis mpg123

  build_web:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    needs: install_emsdk
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    
    - name: get emsdk cache
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
      with: 
        key: emsdk
        path: ${{ env.EMSDK_HOME }}
    
    - name: build onsyuri_web
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ -z "$(printf '%s\n' "$REF_NAME" | grep merge)" ]; then 
          version="$(printf '%s' "$REF_NAME" | sed 's/[\/&]/\\&/g')"
          sed -i -E 's/#define ONS_YURI_VERSION "(.+?)"/#define ONS_YURI_VERSION "'"$version"'"/g' src/onsyuri/version.h
        fi
        cd script 
        EMCSDK=${{ env.EMCSDK }} bash ./cross_web.sh
    
    - name: prepare release
      if: github.event_name == 'push'
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        cd build_web
        mkdir ${{ env.BUILD_NAME }} 
        cp onsyuri{.html,.js,.wasm} ${{ env.BUILD_NAME }}/ 
        cp onsyuri_index.py ${{ env.BUILD_NAME }}/
        7z a -t7z -mtc=on -ms=off -mx=5 -m0=lzma2 ${{ env.BUILD_NAME }}.7z ${{ env.BUILD_NAME }} 
        mv ${{ env.BUILD_NAME }}.7z onsyuri_${REF_NAME}_web.7z
    
    - name: create release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
      if: github.event_name == 'push'
      with:
        artifacts: "./build_web/onsyuri_${{  github.ref_name }}_web.7z"
        allowUpdates: "true"
        token: ${{ secrets.GITHUB_TOKEN }}