name: build android
on:
  push: {tags:  ['v*']} #  Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request: 

# Read-only by default; only the job that creates the release may write
# (Enginehost docs/security/2026-09-24-ci-supply-chain.md).
permissions:
  contents: read

jobs:
  build_android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      with:
        persist-credentials: false
   
    - uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: build onsyuri_android
      env:
        SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
        SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
        SIGN_STORE_PASS: ${{ secrets.SIGN_STORE_PASS }}
        SIGN_JKS_BASE64: ${{ secrets.SIGN_JKS_BASE64 }}
        # The ref name reaches shell and sed only as data, never as script.
        REF_NAME: ${{ github.ref_name }}
      run: |
        # openssl base64 < sign.jks | tr -d '\n' | tee sign.txt
        if [ -n "$SIGN_JKS_BASE64" ]; then
          echo "$SIGN_JKS_BASE64" | base64 --decode > src/onsyuri_android/app/sign.jks
          ls -la src/onsyuri_android/app
        fi
        if [ -z "$(printf '%s\n' "$REF_NAME" | grep merge)" ]; then 
          version="$(printf '%s' "$REF_NAME" | sed 's/[\/&]/\\&/g')"
          sed -i -E 's/#define ONS_YURI_VERSION "(.+?)"/#define ONS_YURI_VERSION "'"$version"'"/g' src/onsyuri/version.h
        fi
        cd script 
        bash ./cross_android.sh
        cd -
        file build_android/outputs/apk/release/*.apk

    - name: prepare to release
      if: github.event_name == 'push'
      env:
        REF_NAME: ${{ github.ref_name }}
      run: cp ./build_android/outputs/apk/release/*.apk "onsyuri_${REF_NAME}_android.apk"
    
    - name: create release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
      if: github.event_name == 'push'
      with:
        artifacts: "onsyuri_${{  github.ref_name }}_android.apk"
        allowUpdates: "true"
        token: ${{ secrets.GITHUB_TOKEN }}