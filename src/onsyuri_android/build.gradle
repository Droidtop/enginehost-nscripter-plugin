// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
}

// Upstream redirected every project's build directory three levels up, out of
// the Android Studio project. Relative to the root project that lands outside
// the repository altogether -- it wrote to /root/build_android on the machine
// this was first built on -- and build output belongs inside the tree it came
// from. Gradle's own default (<project>/build) is used instead.