// The Enginehost runtime APK for the ONScripter engine.
//
// This is still an Android application module rather than a library, because
// what the bundle carries is an APK: Enginehost attaches its compiled resource
// table and its dex to the host runtime process and loads the activity out of
// it. It is never installed as an app, which is why the manifest has no
// launcher activity and this file has no signing config -- the bytes are
// signed as an Enginehost bundle, by the repository key, in CI.
plugins {
    id 'com.android.application'
}

android {
    // The namespace is the package the engine's JNI entry points are exported
    // under (SDL_JAVA_PACKAGE_PATH in the engine's CMakeLists, and the class
    // name in onscripter_main.cpp). Renaming it renames native symbols.
    namespace 'com.yuri.onscripter'

    compileSdk 36
    // The NDK is pinned rather than left to whatever the runner happens to
    // ship: this engine and SDL 2.26 are built against r26, and a silent
    // toolchain change is not something a plugin should discover on a device.
    ndkVersion '26.3.11579264'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "dev.enginehost.plugin.nscripter.onsyuri.slot1"
        // Enginehost's own floor.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        // One bundle serves every device: the host picks lib/<abi> out of the
        // bundle from Build.SUPPORTED_ABIS, so both ABIs ship side by side.
        // arm64-v8a is the console; x86_64 is x86 hardware and the Android
        // emulator rig we test on. Nothing in this engine depends on either --
        // its SIMD helpers are only compiled with USE_SIMD_*, which the
        // Android configuration does not define.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments "-Wno-dev"
            }
        }
    }

    buildTypes {
        release {
            // The engine calls getFD, mkdir and playVideo on this activity by
            // name through JNI, and nothing in Java references them. R8 would
            // remove all three and the engine would fail at a call into a
            // method that no longer exists, so shrinking stays off; upstream
            // has the same note against it ("this may cause jni crash").
            minifyEnabled false
            debuggable false
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    // Enginehost loads this runtime's resources beside its own, which sit at
    // package id 0x7f; a second table at 0x7f is answered from whichever the
    // platform finds first and the bundle silently gets a host resource. The
    // host refuses a bundle that collides, so compile at 0x80.
    androidResources {
        additionalParameters += ["--package-id", "0x80", "--allow-reserved-package-id"]
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            res.srcDirs = ['res']
        }
    }

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'cpp/CMakeLists.txt'
        }
    }
}

// appcompat only: SDLActivity extends AppCompatActivity, so it is required.
// Material and ConstraintLayout went with the standalone game browser this
// bundle does not carry, and a bundle should not ship a library nothing in it
// loads.
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
